  <path d="M90 84c5-1 9-6 11-12" stroke="#c9423c" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <path d="M104 69l8 12" stroke="url(#wood)" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="98" cy="58" r="14" fill="url(#lens)" stroke="url(#wood)" stroke-width="5"/>
  <path d="M91 52c2-4 7-6 11-4" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- 발 -->
  <ellipse cx="42" cy="109" rx="9" ry="4.6" fill="#a82a27"/><ellipse cx="68" cy="109" rx="9" ry="4.6" fill="#a82a27"/>
  <ellipse cx="40" cy="107.6" rx="4.5" ry="1.6" fill="#fff" opacity=".25"/><ellipse cx="66" cy="107.6" rx="4.5" ry="1.6" fill="#fff" opacity=".25"/>
