  <ellipse cx="56" cy="37" rx="35" ry="8.5" fill="#a8741f" opacity=".35"/>
  <ellipse cx="56" cy="35" rx="34" ry="8" fill="url(#brim)"/>
  <path d="M34 34c0-14 9-21 22-21s22 7 22 21z" fill="url(#hat)"/>
  <path d="M34 31h44" stroke="#c0392b" stroke-width="4"/>
  <path d="M42 22c4-5 10-7 16-6" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55"/>
  <!-- 얼굴 -->
  <circle cx="45" cy="66" r="5.2" fill="#2b2b2b"/><circle cx="67" cy="66" r="5.2" fill="#2b2b2b"/>
  <circle cx="46.6" cy="64.4" r="1.9" fill="#fff"/><circle cx="68.6" cy="64.4" r="1.9" fill="#fff"/>
  <ellipse cx="37" cy="78" rx="5.5" ry="3.4" fill="#ff8f86" opacity=".85"/><ellipse cx="75" cy="78" rx="5.5" ry="3.4" fill="#ff8f86" opacity=".85"/>
  <path d="M49 80c3 4 11 4 14 0" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" fill="none"/>
