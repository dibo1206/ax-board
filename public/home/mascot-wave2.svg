<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 윤주팜 마스코트(담벼락 너머로 왼쪽으로 살짝 기울어 인사하는 모습 2): 밀짚모자를 쓴 사과 친구가 돋보기로 살펴보는 모습 (은은한 입체 음영) -->
  <defs>
    <radialGradient id="body" cx="34%" cy="30%" r="80%"><stop offset="0" stop-color="#ff9b8f"/><stop offset=".45" stop-color="#ec5a52"/><stop offset="1" stop-color="#a82a27"/></radialGradient>
    <radialGradient id="hat" cx="40%" cy="25%" r="85%"><stop offset="0" stop-color="#fbeaa8"/><stop offset="1" stop-color="#dba94a"/></radialGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d27a"/><stop offset="1" stop-color="#c58f35"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc15a"/><stop offset="1" stop-color="#3a8230"/></linearGradient>
    <radialGradient id="lens" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".6" stop-color="#cfeaf5" stop-opacity=".7"/><stop offset="1" stop-color="#9fcde3" stop-opacity=".8"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06a3a"/><stop offset="1" stop-color="#6b4424"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <g transform="translate(60 62) scale(0.92) rotate(-8) translate(-60 -60)">
  <ellipse cx="58" cy="113" rx="32" ry="5.5" fill="#000" opacity=".22" filter="url(#blur)"/>
