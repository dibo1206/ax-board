  <path d="M72 100c10-5 18-16 20-30" stroke="#6e1614" stroke-width="7" stroke-linecap="round" fill="none" opacity=".22"/>
  <!-- 꼭지·잎 -->
  <path d="M56 36c-1-9 1-16 6-21" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round" fill="none"/>
