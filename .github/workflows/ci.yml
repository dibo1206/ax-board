# 자동 검사 (2026-11-09): PR을 올리거나 main에 합칠 때마다 GitHub이 새 컴퓨터에서 저절로 돌린다.
# 코드 검사 → 화면 빌드 → 빈 DB에 예시 데이터 → 결제 장애·환불·주문 제출 시험. 하나라도 실패하면 PR에 빨간 X가 뜬다.
# 시험은 가짜 결제 서버와 백엔드 사본을 스스로 띄우므로 결제 키·AI 키는 필요 없다 (Codespaces 처음 준비와 같은 순서)
name: 검사

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farm_mall
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/farm_mall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 라이브러리 설치
        run: npm ci
      - name: 코드 검사 (oxlint)
        run: npm run lint
      - name: 화면 빌드
        run: npm run build
      - name: 상세 블록 규칙 시험 (DB 없이)
        run: npm run test-blocks
      - name: 말로 상품 등록하기 시험 (DB 없이)
        run: npm run test-speak
      - name: 벡터 검색 같은 글 처리 시험 (DB 없이)
        run: npm run test-rag-same
      - name: 상품 Q&A 검색 답 시험 (DB 없이)
        run: npm run test-rag-qna
      - name: 설정 파일(.env) 만들기
        run: npm run setup
      - name: 빈 DB에 예시 데이터 넣기
        run: npm run load-data
      - name: 결제 장애 시험
        run: npm run test-resilience
      - name: 환불·판매자 시험
        run: npm run test-refund
      - name: 주문 제출 시험
        run: npm run test-submit
      - name: 라이브러리 취약점 검사 (높음 이상이면 실패)
        run: npm audit --omit=dev --audit-level=high
      - name: 권한 검사 시험 (로그인 없이 관리자·판매자·회원 주소가 열리는지)
        run: npm run test-authz
      - name: 관리자 로그인 보안 시험 (쿠키·세션 타임아웃·잠금 알림)
        run: npm run test-session
      - name: SQL 인젝션 공격 시험 (시간지연·참거짓·오류·로그인·주문조회)
        run: npm run test-sqli
      - name: XSS 공격 시험 (저장형 스크립트·HTML 이스케이프·CSP)
        run: npm run test-xss
      - name: 그 밖의 공격 시험 (권한상승·주문조작·경로탈출·리다이렉트·CSRF·IDOR)
        run: npm run test-abuse
      - name: 배송 달력·소비기한·찜·단골·판매자 정보 시험
        run: npm run test-extras
