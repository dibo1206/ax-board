# 운영 서버 앞단 (docs/deploy.md 5번). server_name 을 실제 도메인으로 바꾼 뒤
# sudo certbot --nginx -d <도메인> 을 실행하면 443(HTTPS) 설정과 인증서 자동 갱신이 붙는다
server {
    listen 80;
    listen [::]:80;
    server_name shop.yunjufarm.co.kr;

    # 상품 사진은 2MB까지 받는다 (여유 있게 3MB)
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 앱은 TRUST_PROXY_HOPS=1 로 이 값의 마지막 IP(=손님 IP)만 믿는다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
